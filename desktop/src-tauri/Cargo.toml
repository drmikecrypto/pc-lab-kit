[package]
name = "pclabkit"
version = "4.2.4"
description = "PC Lab Kit desktop shell"
authors = ["drmikecrypto"]
edition = "2021"

[lib]
name = "pclabkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
which = "6"
url = "2"
