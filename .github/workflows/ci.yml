name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # Lockfile pulls Symfony 8.x which requires PHP >= 8.4.1 (match release workflow).
          php-version: '8.4'
          extensions: sqlite, curl, mbstring, json, pdo, pdo_sqlite, openssl
          coverage: none
      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist
      - name: Migrate SQLite
        run: php bin/migrate.php || true
      - name: Pest
        run: composer test

  e2e:
    runs-on: ubuntu-latest
    needs: phpunit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite, curl, mbstring, json, pdo, pdo_sqlite, openssl
      - name: Install
        run: |
          composer install --no-interaction --prefer-dist
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: Start PHP lab + mock probe
        env:
          PCLAB_PROBE_TOKEN: e2e-mock-token
        run: |
          php -S 127.0.0.1:8080 -t public >/tmp/php.log 2>&1 &
          node e2e/mock-probe-server.js 18765 >/tmp/mock-probe.log 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8080/diagnostic >/dev/null
          curl -sf http://127.0.0.1:18765/health >/dev/null
          # Health must not leak auth_token
          ! curl -sf http://127.0.0.1:18765/health | grep -q auth_token
          # Session probe-auth returns mock token
          curl -sf -c /tmp/pclab.ck http://127.0.0.1:8080/diagnostic >/dev/null
          curl -sf -b /tmp/pclab.ck http://127.0.0.1:8080/api/diagnostic/probe-auth | grep -q e2e-mock-token
      - name: Playwright
        run: npx playwright test e2e/suite-resume-oem.spec.js e2e/suite-smoke.spec.js
        env:
          CI: 'true'
          PCLAB_BASE_URL: http://127.0.0.1:8080
          PCLAB_SKIP_WEB_SERVER: '1'
          PCLAB_PROBE_TOKEN: e2e-mock-token
          # Use bundled Chromium from `playwright install` (not system Chrome channel).
          PCLAB_PLAYWRIGHT_CHANNEL: ''
