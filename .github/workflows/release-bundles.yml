name: Release PC Lab Kit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite, curl, mbstring, json, pdo

      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

  windows-app:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Windows deps
        shell: pwsh
        run: |
          # WebView2 is preinstalled on windows-latest runners
          rustc --version
          cargo --version

      - name: Build Windows desktop installer
        shell: pwsh
        run: ./scripts/build-desktop-windows.ps1

      - name: Build Windows probe ZIP
        shell: pwsh
        run: ./scripts/build-agent-bundle.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            public/downloads/PcLabKit-Setup-Windows-x64.exe
            public/downloads/pc-lab-kit-probe-windows.zip

  linux-app:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite, curl, mbstring, json, pdo
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build Linux AppImage
        run: |
          chmod +x scripts/*.sh PcLabKit
          ./scripts/build-desktop-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: public/downloads/PcLabKit-Linux-x64.AppImage

  release:
    runs-on: ubuntu-latest
    needs: [windows-app, linux-app]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find dist -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.zip' \) -exec cp -v {} release-assets/ \;
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## PC Lab Kit ${{ github.ref_name }}

            Installable desktop apps — download, install, open **PC Lab Kit**. No browser required.

            ### Downloads
            | Asset | Platform | What it is |
            |-------|----------|------------|
            | `PcLabKit-Setup-Windows-x64.exe` | Windows x64 | Installer — Start Menu app window |
            | `PcLabKit-Linux-x64.AppImage` | Linux x64 | AppImage — chmod +x and run |
            | `pc-lab-kit-probe-windows.zip` | Windows | Optional standalone probe (also bundled in the Windows app) |

            ### Quick start
            1. Download the installer for your OS.
            2. Windows: run the setup EXE. Linux: `chmod +x PcLabKit-Linux-x64.AppImage && ./PcLabKit-Linux-x64.AppImage`.
            3. Open **PC Lab Kit** from the Start Menu (Windows) or the AppImage (Linux).
            4. The lab opens inside the app window. On Windows the probe starts with the app for sensors/benchmarks.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
