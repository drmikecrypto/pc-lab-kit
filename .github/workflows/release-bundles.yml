name: Release PC Lab Kit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fail fast: desktop must be MAJOR.MINOR.PATCH (Tauri); APP_VERSION may be four-part marketing.
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert desktop versions are equal MAJOR.MINOR.PATCH
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./desktop/package.json').version")
          tauri=$(node -p "JSON.parse(require('fs').readFileSync('desktop/src-tauri/tauri.conf.json','utf8')).version")
          cargo=$(grep -m1 '^version' desktop/src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "package.json=$pkg tauri.conf=$tauri Cargo.toml=$cargo"
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          for v in "$pkg" "$tauri" "$cargo"; do
            if ! [[ "$v" =~ $semver ]]; then
              echo "::error::Version '$v' must be MAJOR.MINOR.PATCH (Tauri rejects four-part versions)."
              exit 1
            fi
          done
          if [[ "$pkg" != "$tauri" || "$pkg" != "$cargo" ]]; then
            echo "::error::desktop package.json, tauri.conf.json, and Cargo.toml versions must match."
            exit 1
          fi

      - name: Prefetch Windows PHP pin (releases then archives)
        run: |
          set -euo pipefail
          url=$(node -p "JSON.parse(require('fs').readFileSync('config/build-deps.json','utf8')).php_windows_url")
          ver=$(node -p "JSON.parse(require('fs').readFileSync('config/build-deps.json','utf8')).php_windows_version")
          archive1=$(node -p "const u=require('fs').readFileSync('config/build-deps.json','utf8'); const j=JSON.parse(u); j.php_windows_url.replace('/releases/','/archives/')")
          archive2="https://windows.php.net/downloads/releases/archives/php-${ver}-nts-Win32-vs17-x64.zip"
          ok=0
          for try in "$url" "$archive1" "$archive2"; do
            echo "Checking $try"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --head "$try" || true)
            if [[ "$code" != "200" && "$code" != "302" && "$code" != "301" ]]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' -L -r 0-0 "$try" || true)
            fi
            echo "HTTP $code"
            if [[ "$code" == "200" || "$code" == "206" || "$code" == "302" || "$code" == "301" ]]; then
              ok=1
              break
            fi
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::PHP Windows pin $ver not found on releases or archives. Refresh config/build-deps.json."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: release-preflight
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite, curl, mbstring, json, pdo

      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

  windows-app:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Windows deps
        shell: pwsh
        run: |
          # WebView2 is preinstalled on windows-latest runners
          rustc --version
          cargo --version

      - name: Build Windows desktop installer
        shell: pwsh
        run: ./scripts/build-desktop-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            public/downloads/PcLabKit-Setup-Windows-x64.exe

  linux-app:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite, curl, mbstring, json, pdo
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build Linux AppImage
        run: |
          chmod +x scripts/*.sh PcLabKit
          ./scripts/build-desktop-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: public/downloads/PcLabKit-Linux-x64.AppImage

  release:
    runs-on: ubuntu-latest
    needs: [windows-app, linux-app]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find dist -type f \( -name '*.exe' -o -name '*.AppImage' \) -exec cp -v {} release-assets/ \;
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## PC Lab Kit ${{ github.ref_name }}

            Installable desktop apps — download, install, open **PC Lab Kit**. No browser required. Probe is bundled inside the Windows app.

            ### Downloads
            | Asset | Platform | What it is |
            |-------|----------|------------|
            | `PcLabKit-Setup-Windows-x64.exe` | Windows x64 | Installer — Start Menu app window (probe included) |
            | `PcLabKit-Linux-x64.AppImage` | Linux x64 | AppImage — chmod +x and run |

            ### Quick start
            1. Download the installer for your OS.
            2. Windows: run the setup EXE. Linux: `chmod +x PcLabKit-Linux-x64.AppImage && ./PcLabKit-Linux-x64.AppImage`.
            3. Open **PC Lab Kit** from the Start Menu (Windows) or the AppImage (Linux).
            4. On Windows the probe starts with the app for sensors, drivers, and stress.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
